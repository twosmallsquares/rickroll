<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Definitely Not Suspicious</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 25px;
    }

    .video {
      width: min(800px, 90vw);
      aspect-ratio: 16 / 9;
      border: 3px solid #fff;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    button {
      margin-top: 25px;
      padding: 12px 24px;
      border: 0;
      border-radius: 8px;
      background: #e63946;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background: #ff4d5a;
    }

    /* Fake browser-style dialog */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      align-items: center;
      justify-content: center;
    }

    .dialog {
      width: min(380px, 90vw);
      background: #f5f5f5;
      color: #111;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      text-align: left;
      overflow: hidden;
    }

    .dialog-title {
      padding: 15px 18px;
      font-weight: bold;
      border-bottom: 1px solid #ccc;
    }

    .dialog-body {
      padding: 20px 18px;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      padding: 10px 15px 15px;
    }

    .dialog-actions button {
      margin: 0;
      padding: 8px 20px;
      background: #1976d2;
    }
  </style>
</head>

<body>

  <h1>u got rickrolled</h1>

  <div class="video">
    <iframe
      src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1"
      title="Rickroll"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>

  <button onclick="showRickrollPopup()">
    Click me
  </button>

  <div class="overlay" id="popup">
    <div class="dialog">
      <div class="dialog-title">Browser</div>

      <div class="dialog-body">
        u got rickrolled 😎
      </div>

      <div class="dialog-actions">
        <button onclick="closeRickrollPopup()">OK</button>
      </div>
    </div>
  </div>

  <script>
    function showRickrollPopup() {
      document.getElementById("popup").style.display = "flex";
    }

    function closeRickrollPopup() {
      document.getElementById("popup").style.display = "none";
    }

    // A normal leave confirmation. The browser controls the actual dialog.
    window.addEventListener("beforeunload", function (event) {
      event.preventDefault();
      event.returnValue = "";
    });
  </script>

</body>
</html>
