<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stream Preview</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        iframe {
            border: none;
            border-radius: 8px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            margin-top: 20px;
            font-size: 2rem;
        }
        .start-btn {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- Modern browsers completely block new tabs unless triggered by a click -->
    <button class="start-btn" onclick="engageTrap()">Click to Unmute / Play Video</button>

    <div id="content" style="display:none;">
        <iframe width="500" height="500" src="https://youtube.com" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        <h1>You thought :></h1>
    </div>

<script>
let spawnURL;

function createTauntingPage() {
    // Generates a temporary data URL that displays the "u got rickrolled" message
    const htmlContent = `
        <!DOCTYPE html>
        <html>
        <head><title>Gotcha!</title></head>
        <body style="background:#111; color:red; font-family:sans-serif; text-align:center; padding-top:20vh;">
            <h1>u got rickrolled.</h1>
            <script>
                // If they close this child tab, tell the main tab to open a replacement
                window.onbeforeunload = function() {
                    if (window.opener && !window.opener.closed) {
                        window.opener.postMessage('respawn', '*');
                    }
                };
            <\/script>
        </body>
        </html>
    `;
    return 'data:text/html;charset=utf-8,' + encodeURIComponent(htmlContent);
}

function openTauntTab() {
    window.open(spawnURL, "_blank", "width=400,height=400");
}

function engageTrap() {
    // Hide button, show video content
    document.querySelector('.start-btn').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    spawnURL = createTauntingPage();

    // Open the initial 2 annoying tabs
    openTauntTab();
    openTauntTab();
</script>

</body>
</html>
