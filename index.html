<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rickroll</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 3rem;
        }
        iframe {
            width: min(800px, 90vw);
            aspect-ratio: 16 / 9;
            border: 0;
            display: block;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rickroll</h1>
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1" title="Rickroll" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <script>
        // S'exécute automatiquement dès que le script est chargé
        for (let i = 0; i < 5; i++) {
            const tab = window.open("", "_blank");
            if (!tab) continue;
            tab.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Rickrolled</title>
                    <style>
                        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #111; color: white; font-family: Arial, sans-serif; }
                        h1 { font-size: 4rem; text-align: center; }
                    </style>
                </head>
                <body>
                    <h1>u got rickrolled</h1>
                </body>
                </html>
            `);
            tab.document.close();
        }
    </script>
</body>
</html>
