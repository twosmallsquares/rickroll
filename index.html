<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You Got Rickrolled</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      cursor: pointer;
    }

    .container {
      width: min(900px, 100%);
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 4rem);
    }

    .video {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>

  <main class="container">
    <h1>u got rickrolled</h1>

    <div class="video">
      <iframe
        id="player"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ?enablejsapi=1"
        title="Rick Astley - Never Gonna Give You Up"
        allow="autoplay; encrypted-media"
        allowfullscreen>
      </iframe>
    </div>
  </main>

  <script>
    let started = false;

    document.addEventListener("click", () => {
      if (started) return;
      started = true;

      const player = document.getElementById("player");

      player.src =
        "https://www.youtube.com/embed/dQw4w9WgXcQ" +
        "?autoplay=1&loop=1&playlist=dQw4w9WgXcQ";
    }, { once: true });
  </script>

</body>
</html>
