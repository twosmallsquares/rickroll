<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rickroll</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 3rem;
        }
        iframe {
            width: min(800px, 90vw);
            aspect-ratio: 16 / 9;
            border: 0;
            display: block;
            margin: 20px auto;
            pointer-events: none; /* Forces clicks to pass through to the document */
        }
        /* Invisible layer covering the entire screen to catch the first click */
        #trap-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            cursor: default;
        }
    </style>
</head>
<body>

    <!-- Invisible trigger layer -->
    <div id="trap-layer"></div>

    <div class="container">
        <h1>Rickroll</h1>
        <!-- Starts muted automatically so the browser allows it to play immediately -->
        <iframe id="rickrollVideo" src="https://youtube.com" title="Rickroll" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <script>
        const trapLayer = document.getElementById('trap-layer');
        const video = document.getElementById('rickrollVideo');

        // Triggers the sound and tabs on the absolute first interaction anywhere on screen
        trapLayer.addEventListener('click', () => {
            // 1. Remove the trap layer so they can interact normally afterward
            trapLayer.remove();

            // 2. Reload the video instantly WITH sound now that we have click permission
            video.src = "https://youtube.com";

            // 3. Open tabs safely bypassing pop-up blockers due to the background click
            for (let i = 0; i < 5; i++) {
                const tab = window.open("", "_blank");
                if (!tab) continue;

                tab.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>Rickrolled</title>
                        <style>
                            body {
                                margin: 0;
                                min-height: 100vh;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                background: #111;
                                color: white;
                                font-family: Arial, sans-serif;
                            }
                            h1 { font-size: 4rem; text-align: center; }
                        </style>
                    </head>
                    <body>
                        <h1>u got rickrolled</h1>
                        <script>
                            // Prompt confirmation when user tries to close the tab
                            window.addEventListener('beforeunload', function (e) {
                                e.preventDefault();
                                e.returnValue = 'Are you sure you want to leave the Rickroll?';
                            });
                        <\/script>
                    </body>
                    </html>
                `);
                tab.document.close();
            }
        });
    </script>
</body>
</html>
