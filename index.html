<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rickroll</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 20px;
    }

    h1 {
      font-size: clamp(2rem, 7vw, 4rem);
      margin: 0;
    }

    .video {
      width: min(800px, 90vw);
      aspect-ratio: 16 / 9;
      border: 3px solid white;
      border-radius: 12px;
      overflow: hidden;
      background: black;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    button {
      padding: 14px 24px;
      border: 0;
      border-radius: 8px;
      background: #e63946;
      color: white;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ff4d5a;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <h1>u got rickrolled 😎</h1>

  <div class="video">
    <iframe
      src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&loop=1&playlist=dQw4w9WgXcQ"
      title="Rick Astley - Never Gonna Give You Up"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>

  <button id="rickrollButton">
    DO NOT CLICK
  </button>

  <script>
    const button = document.getElementById("rickrollButton");

    function openRickrollTab() {
      const page = `
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <title>You Got Rickrolled</title>
          <style>
            body {
              margin: 0;
              min-height: 100vh;
              display: flex;
              align-items: center;
              justify-content: center;
              background: #111;
              color: white;
              font-family: Arial, sans-serif;
              text-align: center;
            }

            h1 {
              font-size: clamp(2rem, 8vw, 5rem);
            }
          </style>
        </head>
        <body>
          <h1>u got rickrolled 😎</h1>
        </body>
        </html>
      `;

      const tab = window.open();

      if (tab) {
        tab.document.open();
        tab.document.write(page);
        tab.document.close();
      }
    }

    button.addEventListener("click", () => {
      // Each window.open is directly triggered by the user's click.
      openRickrollTab();
      openRickrollTab();
      openRickrollTab();
    });
  </script>

</body>
</html>
